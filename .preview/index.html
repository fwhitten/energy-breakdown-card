<!doctype html>
<html><head><meta charset="utf-8"><title>harness</title>
<style>
:root{--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--card-background-color:#1c1c1c;--ha-card-background:#1c1c1c;--primary-color:#03a9f4;--accent-color:#ff9800;--energy-grid-consumption-color:#488fc2;--divider-color:#333;--text-primary-color:#fff;--error-color:#f44336;--success-color:#4caf50;--warning-color:#ffa726;}
body{background:#111;font-family:Roboto,system-ui,sans-serif;padding:16px;margin:0;display:flex;gap:16px;align-items:flex-start}
.slot{width:340px}
.h240{height:240px}.h420{height:420px}
.slot>*{height:100%}
ha-card{background:var(--ha-card-background);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
h5{color:#888;font:600 11px/1 sans-serif;margin:0 0 6px}
</style></head><body>
<div><h5>4 rows (240px)</h5><div class="slot h240" id="a"></div></div>
<div><h5>7 rows (420px)</h5><div class="slot h420" id="b"></div></div>
<div><h5>masonry (auto)</h5><div class="slot" id="c"></div></div>
<script type="module">
class HaCard extends HTMLElement{}
customElements.define('ha-card',HaCard);
class HaIcon extends HTMLElement{set icon(v){this.textContent='⚡';this.style.fontSize='30px';this.style.lineHeight='1';}}
customElements.define('ha-icon',HaIcon);

// Small devices against a much larger grid total, and a grid statistic that
// only carries a running sum - the shape that produced 0.00 kWh before.
const DEVICES=[['sensor.lights','Lights',0.036],['sensor.tv','TV',0.005],['sensor.ev','EV Charger',0]];
const prefs={energy_sources:[{type:'grid',flow_from:[{stat_energy_from:'sensor.grid_in'}],flow_to:[]}],device_consumption:DEVICES.map(d=>({stat_consumption:d[0],name:d[1]}))};
function seeded(i){return Math.abs(Math.sin(i*12.9898)*43758.5453%1);}
const hass={locale:{language:'en-GB'},themes:{},async callWS(msg){
  if(msg.type==='energy/get_prefs')return prefs;
  const out={};const s=new Date(msg.start_time).getTime(),e=new Date(msg.end_time).getTime();
  const step=msg.period==='hour'?3600e3:msg.period==='day'?86400e3:2629800e3;
  const now=Date.now();
  for(const id of msg.statistic_ids){
    out[id]=[];let k=0;let running=1000;
    for(let t=s;t<e;t+=step,k++){
      if(t>now)break;
      const dow=new Date(t).getDay();
      const base=step/3600e3*1.1*(dow===0?0.08:1)*(0.85+seeded(k)*0.3);
      if(id==='sensor.grid_in'){running+=base;out[id].push({start:t,end:t+step,change:null,sum:+running.toFixed(3)});}
      else{const dev=DEVICES.find(d=>d[0]===id);out[id].push({start:t,end:t+step,change:+(base*(dev?dev[2]:0)).toFixed(4)});}
    }}
  return out;}};
await import('./energy-breakdown-card.js');
for(const slot of ['a','b','c']){
  const card=document.createElement('energy-breakdown-card');
  card.setConfig({type:'custom:energy-breakdown-card',icon:'mdi:lightning-bolt',default_period:'week'});
  card.hass=hass;
  document.getElementById(slot).appendChild(card);
  window['__'+slot]=card;
}
</script></body></html>
